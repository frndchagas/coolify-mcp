name: OpenAPI Drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned OpenAPI URL
        id: pinned
        run: |
          version=$(grep -oE 'COOLIFY_VERSION = "[^"]+"' src/coolify/constants.ts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "COOLIFY_VERSION not found in src/coolify/constants.ts" >&2
            exit 1
          fi
          echo "url=https://raw.githubusercontent.com/coollabsio/coolify/${version}/openapi.json" >> $GITHUB_OUTPUT

      - name: Download specs
        run: |
          curl -sSL '${{ steps.pinned.outputs.url }}' -o /tmp/openapi-pinned.json
          curl -sSL 'https://raw.githubusercontent.com/coollabsio/coolify/v4.x/openapi.json' -o /tmp/openapi-latest.json

      - name: Compare specs
        id: diff
        run: |
          if diff -q /tmp/openapi-pinned.json /tmp/openapi-latest.json >/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare issue body
        if: steps.diff.outputs.changed == 'true'
        env:
          PINNED_URL: ${{ steps.pinned.outputs.url }}
        run: |
          cat <<EOF > /tmp/openapi-drift.md
          The Coolify OpenAPI spec on \`v4.x\` differs from the pinned version in this repo.

          - Pinned: \`${PINNED_URL}\`
          - Latest: \`https://raw.githubusercontent.com/coollabsio/coolify/v4.x/openapi.json\`

          Recommended action:
          1) Review the diff
          2) Update \`COOLIFY_VERSION\` if appropriate
          3) Regenerate types
          EOF

      - name: Create or update issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Coolify OpenAPI drift detected"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/openapi-drift.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/openapi-drift.md
          fi
